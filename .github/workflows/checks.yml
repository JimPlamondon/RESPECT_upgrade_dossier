name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' reuse
      - run: respect-upgrade-dossier validate --repository-root .
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/inspect_distribution.py dist/*.whl
      - run: reuse lint
      - run: git diff --check
